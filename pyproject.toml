[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-receptionist"
version = "0.1.0"
description = "Multilingual (Hindi/English/Hinglish) AI phone receptionist for Indian clinics, salons and small businesses. Early-stage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # zoneinfo data on platforms without a system tz database (Windows)
]

[project.optional-dependencies]
# Live voice pipeline. Not needed for the API, the demo or the tests of the booking logic.
agent = [
    "livekit-agents>=1.8,<2",
    "livekit-plugins-openai>=1.8,<2",
    "livekit-plugins-silero>=1.8,<2",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_receptionist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
